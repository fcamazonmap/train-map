<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FC Code Trainer</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a63;--bd:#dedcd3;--ac:#e8890c;--ok:#2e8b57;--no:#c0392b;--u:#e4e2d9;--b0:#e57368;--b1:#eea15a;--b2:#f0cf5a;--b3:#b6d869;--b4:#6cc08b;--b5:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#efeee9;--mut:#a09f96;--bd:#3a3935;--u:#3a3935}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#efeee9;--mut:#a09f96;--bd:#3a3935;--u:#3a3935}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mut)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--u);margin:12px 0 6px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut)}
.legend em{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;font-style:normal}
.tabs,.modes{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px}
.q{font-size:13px;color:var(--mut);margin-bottom:6px}
.big{font-size:44px;font-weight:700;letter-spacing:2px;margin:4px 0 14px;word-break:break-word}
.big.sm{font-size:26px;letter-spacing:0}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:12px 14px;display:flex;justify-content:space-between;gap:8px}
.opts small{color:var(--mut)}
.opts button.right{background:var(--ok);border-color:var(--ok);color:#fff}.opts button.right small{color:#e6f5ec}
.opts button.wrong{background:var(--no);border-color:var(--no);color:#fff}.opts button.wrong small{color:#fde}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:8px}
.fb{margin-top:12px;font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.next{margin-top:10px;width:100%;background:var(--ac);border-color:var(--ac);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{padding:5px 8px;border-radius:8px;font-size:13px;font-weight:600;color:#1d1d1b;border:0;background:var(--u)}
:root:not([data-theme="light"]) .chip.u{color:var(--tx)}
.chip.b0{background:var(--b0)}.chip.b1{background:var(--b1)}.chip.b2{background:var(--b2)}.chip.b3{background:var(--b3)}.chip.b4{background:var(--b4)}.chip.b5{background:var(--b5);color:#fff}
.info{min-height:24px;font-weight:600;margin-bottom:10px}
h3{font-size:14px;margin:10px 0 0}.mut{color:var(--mut);font-size:13px}
.hide{display:none}
:root{--sea:#cfe3ee;--land:#f1eee3;--lb:#b3ae9c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sea:#1d2a33;--land:#2c2c28;--lb:#55534b}}
:root[data-theme="dark"]{--sea:#1d2a33;--land:#2c2c28;--lb:#55534b}
.next:disabled{opacity:.5;cursor:default}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent;cursor:crosshair}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-container .leaflet-overlay-pane svg,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-touch-drag{touch-action:pinch-zoom}.leaflet-touch-zoom{touch-action:pan-x pan-y}.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.land{fill:var(--land);fill-opacity:1;stroke:var(--lb);stroke-width:1}
.lbl{white-space:nowrap;font-size:11px;font-weight:600;color:var(--mut);text-shadow:0 0 3px var(--sea),0 0 3px var(--sea)}
.lbl i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mut);margin:0 4px 1px -2px}
#map:not(.hide){position:fixed;inset:0;z-index:50;background:var(--sea)}
#lmap{position:absolute;inset:0;z-index:0;background:var(--sea)}
.mtop,.mbot,.zb{position:absolute;z-index:1000}
.mtop{left:8px;top:calc(8px + env(safe-area-inset-top,0px));width:calc(100% - 16px);max-width:480px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.mrow{display:flex;align-items:center;gap:10px}
.mcode{font-size:28px;font-weight:700;letter-spacing:2px;flex:1}
.mscore b{font-size:20px}.mscore span{font-size:11px;color:var(--mut);margin-left:3px}
.ms{font-size:12px;color:var(--mut);gap:12px;margin-top:2px;flex-wrap:wrap}.ms b{color:var(--tx)}
#mx{padding:6px 11px}
.zb{right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}.zb button{padding:6px 14px;font-size:22px;line-height:1.2}
.mbot{left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:calc(100% - 16px);max-width:520px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.mbot>*{pointer-events:auto}
.fbc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
.mtools{display:flex;flex-wrap:wrap;gap:6px}
.mtools button,.mtools select,.mtools label{padding:8px 11px;font-size:14px;border-radius:10px}
.mtools label{background:var(--card);border:1px solid var(--bd)}
.mbot .next{margin-top:0;padding:14px}
#mat{align-self:flex-start;background:var(--card);padding:1px 6px;border-radius:6px;font-size:10px;color:var(--mut)}#mat:empty{display:none}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head><body><main>
<h1>FC Code Trainer</h1>
<div class="card">
 <div class="stats"><div><b id="sM">0</b><span>mastered</span></div><div><b id="sS">0</b><span>seen</span></div><div><b id="sA">–</b><span>accuracy</span></div><div><b id="sK">0</b><span>streak (best <span id="sB">0</span>)</span></div></div>
 <div class="bar" id="bar"></div>
 <div class="legend"><span><em style="background:var(--u)"></em>new</span><span><em style="background:var(--b0)"></em>missed</span><span><em style="background:var(--b1)"></em>1</span><span><em style="background:var(--b2)"></em>2</span><span><em style="background:var(--b3)"></em>3</span><span><em style="background:var(--b4)"></em>4</span><span><em style="background:var(--b5)"></em>5</span></div>
 <div class="mut" style="margin-top:6px">Mastered = level 4 or higher. Each correct answer moves a code up a level; a miss sends it back.</div>
</div>
<div class="tabs"><button id="tPlay" class="on">Play</button><button id="tMap">Map</button><button id="tCodes">All codes</button></div>

<section id="play">
 <div class="modes">
  <button data-m="c2l" class="on">Code → city</button><button data-m="l2c">City → code</button><button data-m="type">Type the city</button>
  <select id="cf" aria-label="Country filter"></select>
 </div>
 <div class="card" id="qcard"></div>
</section>

<section id="map" class="hide">
 <div id="lmap"></div>
 <div class="mtop">
  <div class="mrow"><button id="mx" aria-label="Exit map">✕</button><div class="mcode" id="mc"></div><div class="mscore"><b id="mP">0</b><span>pts</span></div></div>
  <div class="mrow ms"><span><b id="mR">0</b> rounds</span><span><b id="mD">–</b> avg km</span><span><b id="mM">0</b> mastered</span><span>hit = within 50 km</span></div>
  <div class="bar" id="mbar" style="margin:6px 0 0;height:8px"></div>
 </div>
 <div class="zb"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="zh" aria-label="Reset view">⌂</button></div>
 <div class="mbot">
  <div class="fbc hide" id="mnote"></div>
  <div id="mfb"></div>
  <div class="mtools"><button data-l="o">Outline</button><button data-l="s">Street</button><button data-l="a">Satellite</button><select id="mf" aria-label="Country filter"></select><label><input type="checkbox" id="lb" checked> labels</label></div>
  <button class="next" id="mg" disabled>Tap the map to place a guess</button>
  <div id="mat"></div>
 </div>
</section>

<section id="codes" class="hide">
 <div class="info" id="info">Tap a code to reveal its location.</div>
 <div id="list"></div>
 <div style="margin-top:16px"><button id="reset">Reset progress</button></div>
</section>
</main>
<script>
const RAW=`BCN1|Barcelona|ES
BCN3|Barcelona|ES

WRO1|Wroclaw|PL
WRO2|Wroclaw|PL
WRO5|Wroclaw|PL

DMU5|München (Aschheim/Feldkirchen area)|DE

DMU2|München (Aying/Glonn area)|DE
DMU1|München (Fürstenfeldbruck area)|DE
HMU3|München (Ismaning/Garching area)|DE
XOS1|Brebières|FR
CGN9|Köln (Hürth/Wesseling area)|DE
BER3|Brieselang|DE
DAP8|Premstätten|AT
GXO|Bristol/Avonmouth area|UK
BCN2|Martorelles|ES
FCO8|Fiano Romano|IT
DBY8|Bayreuth|DE
XAR1|Eskilstuna kommun|SE
AOI1|Jesi|IT
DVI3|Vienna|AT
LYS2|Colombier-Saugnieu|FR
RBCN|Barcelona|ES|1
RBET|Bettembourg|LU|1
RDOU|Dourges|FR|1
RDUIS|Duisburg|DE|1
RHAN|Hannover|DE|1
RHOF|Hof|DE|1
RKTW|Katowice|PL|1
RLEJ|Leipzig|DE|1
RLIL|Lille|FR|1
RMAD|Madrid|ES|1
RMAN|Mannheim|DE|1
RMET|Metz|FR|1
RNOV|Novara|IT|1
RPRG|Prague|CZ|1
RVEN|Venezia|IT|1
RVER|Verona|IT|1
RWRO|Wroclaw|PL|1`;
const CN={LU:'Luxembourg',ES:'Spain',DE:'Germany',IT:'Italy',FR:'France',PL:'Poland',CZ:'Czech Republic',SK:'Slovakia',AT:'Austria',SE:'Sweden',UK:'United Kingdom'};
const F=RAW.split('\n').map(l=>{const [c,city,cc,g]=l.split('|');return{c,city,cc,g,k:city.replace(/ ?\(.*\)/,'').replace(/ area$/,'')}});
const $=s=>document.querySelector(s);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S={p:{},best:0,tot:0,ok:0,streak:0};
try{const x=JSON.parse(localStorage.getItem('fcp')||'null');if(x&&x.p)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('fcp',JSON.stringify(S))}catch(e){}};
S.m=S.m||{};S.ms=S.ms||{r:0,pts:0,d:0,best:0};
const cls=c=>S.p[c]?'b'+S.p[c].b:'u';
let mode='c2l',cf='all',last=null,cur=null,done=false;

function stats(){
  const cnt=[0,0,0,0,0,0,0];let seen=0,mast=0;
  F.forEach(f=>{const p=S.p[f.c];if(!p)cnt[6]++;else{cnt[p.b]++;seen++;if(p.b>=4)mast++}});
  $('#sM').textContent=mast+'/'+F.length;$('#sS').textContent=seen;
  $('#sA').textContent=S.tot?Math.round(100*S.ok/S.tot)+'%':'–';
  $('#sK').textContent=S.streak;$('#sB').textContent=S.best;
  const cols=['var(--b5)','var(--b4)','var(--b3)','var(--b2)','var(--b1)','var(--b0)','var(--u)'];
  const order=[5,4,3,2,1,0,6];
  $('#bar').innerHTML=order.map((k,i)=>'<i style="width:'+(100*cnt[k]/F.length)+'%;background:'+cols[i]+'"></i>').join('');
}
const pool=()=>F.filter(f=>cf==='all'||f.cc===cf);
function pick(){
  const W=[8,6,4,2,1,.5],p=pool().filter(f=>f.c!==last);
  const w=p.map(f=>S.p[f.c]?W[S.p[f.c].b]:8);
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<p.length;i++){r-=w[i];if(r<=0)return p[i]}
  return p[p.length-1];
}
function distract(f,n){
  const o=F.filter(x=>x.k!==f.k),same=sh(o.filter(x=>x.cc===f.cc)),diff=sh(o.filter(x=>x.cc!==f.cc));
  const out=[],seen=new Set([f.k]);
  for(const x of [...same.slice(0,Math.ceil(n*.7)*3),...diff]){if(out.length>=n)break;if(!seen.has(x.k)){seen.add(x.k);out.push(x)}}
  return out;
}
const nz=s=>s.toLowerCase().replace(/ß/g,'ss').replace(/ł/g,'l').normalize('NFD').replace(/[^a-z]/g,'');
const AL={munich:'munchen',muenchen:'munchen',milan:'milano',cologne:'koln',koeln:'koln',rome:'roma',turin:'torino',seville:'sevilla',nuremberg:'nurnberg',vienna:'vienna',prag:'prague',cagliari:'cagliari'};

function next(){
  cur=pick();last=cur.c;done=false;const f=cur,q=$('#qcard');
  if(mode==='type'){
    q.innerHTML='<div class="q">Which city is this facility in?</div><div class="big">'+f.c+'</div><input type="text" id="ti" autocomplete="off" autocapitalize="off" placeholder="City name"><button class="next" id="go" style="margin-top:0">Check</button><div id="fb"></div>';
    const ti=$('#ti');ti.focus();
    const chk=()=>{if(done||!ti.value.trim())return;const v=nz(ti.value),n=AL[v]||v;answer(f.k.split('/').map(nz).includes(n),null)};
    $('#go').onclick=chk;ti.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done?next():chk()}};
    return;
  }
  let opts,txt,prompt;
  if(mode==='c2l'){
    prompt='<div class="q">Where is this facility?</div><div class="big">'+f.c+'</div>';
    opts=sh([{t:f.city,sub:'',ok:true},...distract(f,3).map(x=>({t:x.city,sub:'',ok:false}))]);
  }else{
    prompt='<div class="q">Which code is a facility in…</div><div class="big sm">'+f.k+', '+CN[f.cc]+'?</div>';
    const ds=distract(f,3).map(x=>({t:x.c,sub:x.city,ok:false}));
    opts=sh([{t:f.c,sub:f.city,ok:true},...ds]);
  }
  q.innerHTML=prompt+'<div class="opts">'+opts.map((o,i)=>'<button data-i="'+i+'"><span>'+o.t+'</span><small></small></button>').join('')+'</div><div id="fb"></div>';
  const bs=[...q.querySelectorAll('.opts button')];
  bs.forEach((b,i)=>b.onclick=()=>{
    if(done)return;
    bs.forEach((x,j)=>{if(opts[j].ok)x.classList.add('right');if(mode==='l2c')x.querySelector('small').textContent=opts[j].sub});
    if(!opts[i].ok)b.classList.add('wrong');
    answer(opts[i].ok,null);
  });
  cur._bs=bs;
}
function answer(ok,_){
  done=true;const f=cur,p=S.p[f.c]||(S.p[f.c]={b:0,n:0,r:0});
  p.n++;if(ok){p.r++;p.b=Math.min(5,p.b+1);S.ok++;S.streak++;S.best=Math.max(S.best,S.streak)}else{p.b=0;S.streak=0}
  S.tot++;save();stats();
  const full=f.c+' · '+f.city+', '+CN[f.cc]+(f.g?' (best guess)':'');
  $('#fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'Correct! ':'Not quite. ')+full+' <span class="mut">(level '+p.b+')</span></div><button class="next" id="nx">Next →</button>';
  $('#nx').onclick=next;$('#nx').focus();
  const ti=$('#ti');if(ti){ti.readOnly=true;$('#go').classList.add('hide')}
}
document.addEventListener('keydown',e=>{
